services:
  bot:
    restart: always
    depends_on:
      # Not the base file's `db`: that service is gated behind the `local-db`
      # profile for development, and profiles cannot be cleared by an overlay,
      # so composing the two files would start the bot with no database at all.
      # Production carries its own service under a name the profile does not
      # cover, so `docker compose -f docker-compose.yml -f docker-compose.prod.yml`
      # brings up the pair without needing a profile flag the host may not pass.
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://bot:${POSTGRES_PASSWORD}@postgres:5432/bot_db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
