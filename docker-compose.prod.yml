# Standalone production stack: the bot plus its own Postgres.
#
# Deliberately not an overlay on docker-compose.yml. Dokploy accepts exactly one
# compose file per service (Dokploy/dokploy#1727), so a production arrangement
# that only works as `-f base -f prod` cannot be deployed there at all. This
# file is therefore complete on its own:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# docker-compose.yml stays the development file, where `db` sits behind the
# local-db profile so an external DATABASE_URL can be used instead.
services:
  bot:
    build: .
    restart: always
    # Dokploy writes the Environment tab to a .env beside this file but does not
    # inject it into containers, so DISCORD_TOKEN and MONGODB_URI are read from
    # there. POSTGRES_PASSWORD is interpolated below from the same file.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://bot:${POSTGRES_PASSWORD}@postgres:5432/bot_db
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
